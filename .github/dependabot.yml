# 의존성 갱신 자동화 — 수동 월간 절차 대신 PR이 오고, CI 게이트
# (pytest·vitest·E2E·타입 드리프트 가드)가 검증한다. 마이너·패치는 묶어
# 소음을 줄이고, 메이저는 개별 PR로 따로 검토한다.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "20:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "20:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      js-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "20:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3

  # postgres·redis·caddy 베이스 이미지 — compose 정의와 앱 Dockerfile 양쪽.
  - package-ecosystem: "docker-compose"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "20:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
      - "/apps/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "20:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
