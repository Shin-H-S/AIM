name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 테스트는 운영과 같은 PostgreSQL에서 돈다 — 스키마도 alembic upgrade head로
    # 만든다. SQLite에서는 마이그레이션 정합성도, PostgreSQL 고유 동작도 검증되지
    # 않는다. 자세한 근거는 conftest.py 참조.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aim
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aim -d aim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aim:aim@localhost:5432/aim_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Test
        run: uv run pytest

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @aim/web lint
      - name: Type check
        run: pnpm --filter @aim/web typecheck
      - name: Test
        run: pnpm --filter @aim/web test
      - name: Build
        run: pnpm --filter @aim/web build

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aim
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aim -d aim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aim:aim@localhost:5432/aim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Upgrade to head
        run: uv run alembic -c migrations/alembic.ini upgrade head
      - name: Downgrade to base
        run: uv run alembic -c migrations/alembic.ini downgrade base
      - name: Re-upgrade to head
        run: uv run alembic -c migrations/alembic.ini upgrade head
      # 마이그레이션 head가 만든 스키마와 SQLAlchemy 모델이 실제로 같은지 확인한다.
      # 위 세 단계는 마이그레이션이 "에러 없이 도는지"만 보므로, 모델에 추가한
      # 컬럼을 마이그레이션에 빠뜨려도 통과한다. 테스트는 create_all로 스키마를
      # 만들기 때문에 그 드리프트를 잡지 못한다 — 여기가 유일한 방어선이다.
      - name: Check for model/migration drift
        run: uv run alembic -c migrations/alembic.ini check
