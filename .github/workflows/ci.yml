name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 테스트는 운영과 같은 PostgreSQL에서 돈다 — 스키마도 alembic upgrade head로
    # 만든다. SQLite에서는 마이그레이션 정합성도, PostgreSQL 고유 동작도 검증되지
    # 않는다. 자세한 근거는 conftest.py 참조.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aim
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aim -d aim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aim:aim@localhost:5432/aim_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      # 커버리지 게이트는 목표치가 아니라 래칫이다 — 커버리지 자체를 목표로
      # 삼으면 라인만 훑는 무의미한 테스트를 쓰게 되므로, "덮여 있던 곳이
      # 벗겨지는" 것만 잡는다.
      #
      # 실측은 90.2%인데 기준선을 89로 둔 이유: 기능이 하나 붙을 때마다 전체
      # 비율은 소수점 단위로 흔들린다. 여유가 0.2pp면 래칫이 아니라 지뢰선이라,
      # 정상적인 기능 추가마다 CI가 터진다. 1pp 남겨 두면 노이즈는 넘기고
      # 실제 회귀(테스트가 통째로 빠지는 수준)는 그대로 걸린다.
      #
      # 기본 addopts에 넣지 않은 이유: 파일 하나만 돌릴 때도 게이트가 걸려
      # 개발 중에 계속 실패한다.
      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-fail-under=89
      # API 표면이 바뀌면 스냅샷 재생성을 강제한다. 이 스냅샷에서 프런트 타입이
      # 생성되므로, 여기서 멈추면 백엔드 변경이 프런트에 조용히 스며들 수 없다.
      - name: OpenAPI snapshot is fresh
        run: uv run python scripts/export_openapi.py --check

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @aim/web lint
      - name: Type check
        run: pnpm --filter @aim/web typecheck
      - name: Test
        run: pnpm --filter @aim/web test
      # 스냅샷이 바뀌면 생성 타입도 함께 갱신돼야 한다. 낡은 타입으로 코드를
      # 쓰면 컴파일은 통과해도 런타임에 깨진다 — 그 간극을 diff로 막는다.
      - name: Generated API types are fresh
        run: |
          pnpm --filter @aim/web generate:api
          git diff --exit-code apps/web/lib/api-schema.d.ts
      - name: Build
        run: pnpm --filter @aim/web build

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aim
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aim -d aim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aim:aim@localhost:5432/aim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Upgrade to head
        run: uv run alembic -c migrations/alembic.ini upgrade head
      - name: Downgrade to base
        run: uv run alembic -c migrations/alembic.ini downgrade base
      - name: Re-upgrade to head
        run: uv run alembic -c migrations/alembic.ini upgrade head
      # 마이그레이션 head가 만든 스키마와 SQLAlchemy 모델이 실제로 같은지 확인한다.
      # 위 세 단계는 마이그레이션이 "에러 없이 도는지"만 보므로, 모델에 추가한
      # 컬럼을 마이그레이션에 빠뜨려도 통과한다. 테스트는 create_all로 스키마를
      # 만들기 때문에 그 드리프트를 잡지 못한다 — 여기가 유일한 방어선이다.
      - name: Check for model/migration drift
        run: uv run alembic -c migrations/alembic.ini check

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aim
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aim -d aim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @aim/web exec playwright install --with-deps chromium
      # 실제 API(uvicorn)와 빌드된 웹(next start)을 Playwright webServer가 띄운다.
      # DB 초기화·마이그레이션도 그 기동 명령에 들어 있다 — 로컬과 같은 경로.
      - name: Run E2E
        run: pnpm --filter @aim/web e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
