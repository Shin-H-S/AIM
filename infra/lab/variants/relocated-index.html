<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- AIM 도메인 인증 토큰: index.html과 같은 값을 유지해야 인증이 풀리지 않는다. -->
    <meta name="aim-verification" content="aim_verify_3Z4_NBW9IqIsrw1VXEW9mn7awyt9uIJj">
    <title>AIM Lab — 홈</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, "Segoe UI", sans-serif; background: #f6f8fb; color: #14161a;
      }
      main { width: min(420px, 90vw); background: #fff; border: 1px solid #e4e8ef;
             border-radius: 14px; padding: 32px; box-shadow: 0 8px 30px rgba(20, 30, 60, .06); }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 22px; font-size: 14px; color: #66707f; line-height: 1.7; }
      a.cta { display: inline-block; padding: 11px 20px; font-size: 14px; font-weight: 700;
              color: #fff; background: #1f6feb; border-radius: 8px; text-decoration: none; }
      footer { margin-top: 20px; font-size: 11px; color: #97a0ae; }
    </style>
  </head>
  <body>
    <main>
      <h1>AIM Lab</h1>
      <!-- 시나리오 스테일 재현: 홈은 정상 렌더되지만 로그인 폼이 /login 으로 이사했다.
           옛 시나리오는 여기서 #email 을 찾다 실패한다 — 7/18 실제 사고와 같은 모양.
           UI 회귀와의 결정적 차이는 '이동 흔적'(아래 CTA)이 남아 있다는 점이다. -->
      <p>실험대 홈입니다. 로그인 폼은 별도 페이지로 이동했습니다.</p>
      <a class="cta" id="login-cta" href="/login.html">로그인하러 가기</a>
      <footer>상태: 폼 이사 (variants/relocated-index.html)</footer>
    </main>
  </body>
</html>
