    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, "Segoe UI", sans-serif; background: #f6f8fb; color: #14161a;
      }
      main { width: min(360px, 90vw); background: #fff; border: 1px solid #e4e8ef;
             border-radius: 14px; padding: 28px; box-shadow: 0 8px 30px rgba(20, 30, 60, .06); }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p.sub { margin: 0 0 20px; font-size: 13px; color: #66707f; }
      .crash { border: 1px solid #f3c2cb; background: #fdeaee; color: #a3123a;
               border-radius: 10px; padding: 16px; font-size: 13px; line-height: 1.7; }
      footer { margin-top: 18px; font-size: 11px; color: #97a0ae; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>AIM Lab</h1>
      <p class="sub">조사 에이전트 도그푸딩용 실험대입니다.</p>
      <!-- UI 회귀 재현: 페이지(문서)는 200으로 응답하지만 폼 컴포넌트 렌더가 실패해
           #email·#password·submit 이 DOM에 없다. 스테일과 달리 대체 경로(CTA/링크)도 없다. -->
      <div class="crash" role="alert">
        로그인 폼을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.
      </div>
      <footer>상태: UI 회귀 (variants/ui-broken.html)</footer>
    </main>
    <script>

      console.error("LoginForm render failed: Cannot read properties of undefined (reading 'fields')");
