[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../apps/api/src
# 경로 하나를 공백·쉼표·콜론으로 쪼개던 레거시 동작을 끈다. 윈도우 경로의
# 드라이브 문자(C:)가 콜론에서 잘려 임포트가 깨지는 것을 막는다.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
